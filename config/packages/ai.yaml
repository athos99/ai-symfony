ai:
        # Inference Platform configuration
        # see https://github.com/symfony/ai/tree/main/src/platform#platform-bridges
    platform:
        openrouter:
            api_key: '%env(OPENROUTER_KEY)%'
            http_client: 'App\Service\LoggingHttpClient'


        openai:
            http_client: '%env(QWEN_URL)%'
            api_key: '%env(QWEN_KEY)%'

        generic:
            qwen_local:
                base_url: '%env(QWEN_URL)%'             # ex. http://localhost:8000/v1
                api_key: '%env(QWEN_KEY)%'              # n'importe quelle valeur si le serveur n'en exige pas
                completions_path: '/chat/completions'   # chemin relatif au base_url


        # Agent configuration
        # see https://symfony.com/doc/current/ai/bundles/ai-bundle.html
    agent:
        default:
            platform: 'ai.platform.openrouter'
            model:
                name: '%env(OPENROUTER_MODEL)%'
                options:
                    temperature: .6
            tools:
                - 'App\Ai\Tool\FetchUrl'
            include_sources: true

        agent3:
            platform: 'ai.platform.openrouter'
            model:
                name: '%env(OPENROUTER_MODEL)%'
                options:
                    temperature: .6
            prompt:
                text: |
                    Please answer the users question based on Wikipedia, only use information provided in the messages.
                    If you don't know the answer, say so. Be concise and to the point. Use markdown formatting.
                include_tools: true
            tools:
                - 'Symfony\AI\Agent\Bridge\Wikipedia\Wikipedia'
#                - 'App\Ai\Tool\FetchUrl'
            include_sources: true



        agent4:
            platform: 'ai.platform.openrouter'
            model:
                name: '%env(OPENROUTER_MODEL)%'
                options:
                    temperature: .6
            prompt:
                text: |
                    Tu es un assistant qui aide à trouver des informations sur le site de l'État de Genève (ge.ch).
                    Utilise l'outil recherche_ge_ch pour répondre. Cite toujours l'URL des pages utilisées
                    et dis clairement quand tu ne trouves rien de pertinent. Utilise un langage très simple et facilement
                    compréhensible. Utilise des phrases courtes.
                include_tools: true
            tools:
                - 'App\Ai\Tool\GeSearchTool'
            include_sources: true

            # platform: 'ai.platform.generic.qwen_local'
